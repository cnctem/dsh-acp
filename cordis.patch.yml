# dsh-acp profile bundle: a Zed/editor-oriented ACP bridge over dsh-base.
# It replaces the shipped automation-only ACP row when composed after dsh-acp-app,
# while the unique startup row also keeps standalone base-backed profiles working.

# Fallback persona for deployments that do not mount an agent preset.
- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding assistant powered by the {{model}} model.

# Stdio protocol servers do not participate in module reloads.
- id: hmr
  disabled: true
- id: session-title-llm
  disabled: true

# The model-facing agent plane comes from a declared preset. Host infrastructure
# (sandbox, approval, persistence, LLM routes, MCP resources) stays global.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

# Disable the shipped automation bridge and startup under their original ids.
# Missing rows warn harmlessly in legacy base-only profiles.
- id: acp-app-startup
  disabled: true
- id: acp
  disabled: true

- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    # Host-plane providers required by the cordis/creation preset.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    # Reuse dsh's command-line/stdin-lifetime provider under a unique id.
    - id: acp-editor-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp-editor
      name: '@cnctem/dsh-acp'
      inject: [acpAppStartup]
      config:
        provider: !!js process.env.DSH_ACP_PROVIDER
        model: !!js process.env.DSH_ACP_MODEL
        preset: !!js process.env.DSH_ACP_PRESET
